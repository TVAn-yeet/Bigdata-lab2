<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="562" viewBox="0 0 1180 562" role="img" aria-labelledby="title desc">
<title id="title">T2 quality metrics before and after curation</title>
<desc id="desc">Separate metric ratios with numerator and denominator labels. No aggregate quality score.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="18" y="34" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#172033">T2 quality metrics by population</text>
<text x="18" y="58" font-family="Arial, sans-serif" font-size="13" fill="#4b5563">Each row shows the measured numerator / denominator; dimensions are not averaged.</text>
<rect x="18" y="74" width="13" height="13" rx="2" fill="#2563eb"/>
<text x="39" y="85" font-family="Arial, sans-serif" font-size="13" fill="#374151">Before: deterministic winners W</text>
<rect x="257" y="74" width="13" height="13" rx="2" fill="#0f766e"/>
<text x="278" y="85" font-family="Arial, sans-serif" font-size="13" fill="#374151">After: curated candidate</text>
<text x="405" y="101" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">0%</text>
<text x="535.0" y="101" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">50%</text>
<text x="665" y="101" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">100%</text>
<line x1="18" y1="175" x2="1162" y2="175" stroke="#e5e7eb"/>
<text x="18" y="129" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2937">Required-field completeness</text>
<rect x="405" y="137" width="260" height="11" rx="5" fill="#eef2f7"/>
<rect x="405" y="137" width="257.13" height="11" rx="5" fill="#2563eb"/>
<text x="679" y="147" font-family="Arial, sans-serif" font-size="11" fill="#374151">Before: 98.9% (9850/9960)</text>
<rect x="405" y="157" width="260" height="11" rx="5" fill="#eef2f7"/>
<rect x="405" y="157" width="260.00" height="11" rx="5" fill="#0f766e"/>
<text x="679" y="167" font-family="Arial, sans-serif" font-size="11" fill="#374151">After: 100.0% (9610/9610)</text>
<line x1="18" y1="247" x2="1162" y2="247" stroke="#e5e7eb"/>
<text x="18" y="201" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2937">Business-key uniqueness before deduplication</text>
